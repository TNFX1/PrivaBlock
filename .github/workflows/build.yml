name: Build

on:
  push:
    branches: [main, v3]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: rebuild the Chromium rulesets from fresh lists
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: privablock-${{ github.sha }}
          path: dist/*.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "PrivaBlock $GITHUB_REF_NAME" --generate-notes dist/*.zip
    permissions:
      contents: write
