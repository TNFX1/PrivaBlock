name: Build

on:
  push:
    branches: [main, v3]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "0 4 * * 1" # weekly: rebuild the Chromium rulesets from fresh lists and release them
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # = bash -eo pipefail, so a failing test isn't hidden by tee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Chromium only reads the filter lists that were compiled into the zip, so the weekly run gives
      # them a new version: <package.json version>.<YYDDD>, e.g. 3.1.2.26320. A later 3.1.3 sorts above it.
      - name: Weekly lists version
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          v="$(node -p 'require("./package.json").version').$(date -u +%y%j | sed 's/^0*//')"
          node -e 'const f="package.json",p=require("./"+f);p.version=process.argv[1];require("fs").writeFileSync(f,JSON.stringify(p,null,2)+"\n")' "$v"
          echo "LISTS_VERSION=$v" >> "$GITHUB_ENV"
      - run: npm test
      - run: npm run build
      # Failing checks become annotations, which are readable without signing in to GitHub.
      - name: Firefox smoke test
        run: |
          node tests/browser/firefox-smoke.mjs 2>&1 | tee smoke.log || { grep -E 'FAIL|Error' smoke.log | sed 's/^/::error::firefox: /'; exit 1; }
      # Branded Chrome ignores --load-extension, so use Chrome for Testing.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
      - name: Chromium smoke test
        run: |
          # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs unless the binary has an AppArmor profile.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          node tests/browser/chromium-smoke.mjs --browser "$CHROME" 2>&1 | tee smoke.log || { grep -E 'FAIL|Error' smoke.log | sed 's/^/::error::chromium: /'; exit 1; }
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: privablock-${{ github.sha }}
          path: dist/*.zip
      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "PrivaBlock $GITHUB_REF_NAME" --generate-notes dist/*.zip
      - name: Release fresh Chromium lists (weekly)
        if: env.LISTS_VERSION != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "lists-$LISTS_VERSION" --target "$GITHUB_SHA" --latest=false \
            --title "PrivaBlock $LISTS_VERSION (Chromium, fresh filter lists)" \
            --notes "Weekly rebuild of the Chromium extension with this week's filter lists. No code changes. Firefox downloads lists by itself and needs no update." \
            "dist/privablock-chromium-$LISTS_VERSION.zip"
    permissions:
      contents: write
