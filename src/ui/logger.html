<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="loggerTitle">PrivaBlock</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="logger.css">
</head>
<body>
<header class="bar">
  <div class="brand">
    <img src="../icons/icon48.png" alt="" width="28" height="28">
    <div><h1 data-i18n="loggerTitle"></h1><small id="target"></small></div>
  </div>
  <div class="tools">
    <input id="filter" type="search" data-i18n-placeholder="loggerFilter" data-i18n-aria-label="loggerFilter">
    <button id="refresh" class="btn" type="button" data-i18n="loggerRefresh" hidden></button>
    <button id="pause" class="btn" type="button" data-i18n="loggerPause"></button>
    <button id="clear" class="btn" type="button" data-i18n="loggerClear"></button>
    <button id="reload" class="btn primary" type="button" data-i18n="loggerReload"></button>
  </div>
</header>
<p id="note" class="note"></p>
<table>
  <thead><tr>
    <th data-i18n="loggerTime"></th><th data-i18n="loggerAction"></th><th data-i18n="loggerType"></th>
    <th data-i18n="loggerRequest"></th><th data-i18n="loggerFilterCol"></th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<p id="empty" class="empty" data-i18n="loggerEmpty"></p>
<script type="module" src="logger.js"></script>
</body>
</html>
