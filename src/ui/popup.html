<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PrivaBlock</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body data-state="unavailable">
<section class="field">
  <div class="top">
    <span id="site"></span>
    <label class="sw"><input id="siteSwitch" type="checkbox" role="switch" data-i18n-aria-label="popupSiteProtection"><span class="track"></span></label>
  </div>
  <strong id="count"></strong>
  <p id="caption"></p>
  <svg id="quills" viewBox="0 0 300 26" preserveAspectRatio="none" aria-hidden="true"></svg>
</section>
<section class="list">
  <div id="todayRow" class="row dim" hidden><span data-i18n="popupToday"></span><b id="today"></b></div>
  <button id="logger" class="row" type="button" data-i18n="popupLogger"></button>
  <button id="settings" class="row" type="button" data-i18n="popupSettings"></button>
</section>
<script type="module" src="popup.js"></script>
</body>
</html>
